  <path
    d="M42.5 48.5H48.8C50.3 48.5 51.5 47.3 51.5 45.8C51.5 44.4 50.5 43.3 49.1 43.1C48.6 41.3 47 40 45 40C42.8 40 41 41.8 41 44C39.9 44.3 39.2 45.2 39.2 46.3C39.2 47.5 40.2 48.5 41.5 48.5H42.5Z"
